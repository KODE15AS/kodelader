name: kodelader

services:
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "8096:8096"   # offentlig (Funnel /kodelader)
      - "8097:8097"   # admin (kun tailnett via tailscale serve)
    env_file: .env
    environment:
      DB_PATH: /data/kodelader.sqlite
    volumes:
      - ./data:/data
    labels:
      raven.project: "kodelader"
    networks:
      - default
      - enhetsnett

# Enhetsnettet (delt docker-nett på raven, 172.31.100.0/24, opprettet
# 19.10.2026): direkte HTTP-adgang til smartenhetene på kontor-wifi-en
# (Shelly 10.10.0.14, Mill 10.10.0.22, …) via FortiGate-policyen «Raven
# til Klientnett (enheter)» — i tillegg til Shelly-ens innringing via WS.
# Drenger på nettet når også hverandre med containernavn.
networks:
  enhetsnett:
    external: true
